name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
      acknowledged_ci_failure_run_id:
        description: "Exact failed push-CI run ID being acknowledged"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Single owner of the published image coordinates. Both the credential
  # preflight and docker_prepare read these, so the preflight can never prove
  # push against a repository the publish jobs do not actually target.
  RELEASE_REGISTRY: ghcr.io
  RELEASE_IMAGE_REPOSITORY: flapjackhq/flapjack

jobs:
  validate_release_version:
    name: Validate requested release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify requested version matches checked-in release files
        env:
          VERSION: ${{ github.event.inputs.version }}
          ACTUAL_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail

          # workflow_dispatch lets an operator select any branch or tag. Refuse that
          # valid GitHub UI/API shape before credentials or downstream publication
          # jobs can run; releases are cut only from the exact public main ref.
          if [[ "$ACTUAL_REF" != "refs/heads/main" ]]; then
            echo "ERROR: releases must be dispatched from refs/heads/main, got $ACTUAL_REF" >&2
            exit 1
          fi

          # The workflow input is reused in Cargo, changelog, git tag, and Docker
          # tag contexts. Keep it to a literal semver-like subset that those
          # systems all accept so metacharacters cannot weaken the validation
          # gate or produce unsafe release identifiers.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: version must match MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-prerelease" >&2
            exit 1
          fi

          cargo_files=(
            engine/Cargo.toml
            engine/flapjack-http/Cargo.toml
            engine/flapjack-replication/Cargo.toml
            engine/flapjack-server/Cargo.toml
            engine/flapjack-ssl/Cargo.toml
          )

          for cargo_file in "${cargo_files[@]}"; do
            if ! grep -Fxq "version = \"$VERSION\"" "$cargo_file"; then
              echo "ERROR: $cargo_file does not declare version ${VERSION}" >&2
              exit 1
            fi
          done

          if ! grep -Fq "## [${VERSION}] - " CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md is missing the ${VERSION} release heading" >&2
            exit 1
          fi

  # Proves the GHCR credential can push BEFORE `release` cuts the public tag.
  # Gated only on version validation so it runs beside the build matrix and adds
  # no wall-clock; `release` waits on it, which is what keeps an expired
  # GHCR_TOKEN from producing a half-release (binaries published, images
  # missing, tag irreversible — the v1.0.9 shape).
  ghcr_publish_preflight:
    name: Verify GHCR publish credential
    needs: validate_release_version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Prove the release credential can push to the release image repository
        working-directory: engine
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: package/ghcr_publish_preflight "$RELEASE_IMAGE_REPOSITORY"

  release_ci_status_preflight:
    name: Verify release target CI status
    needs: validate_release_version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Require terminal push CI success or an exact failed-run acknowledgement
        working-directory: engine
        env:
          GH_TOKEN: ${{ github.token }}
          ACKNOWLEDGED_CI_FAILURE_RUN_ID: ${{ github.event.inputs.acknowledged_ci_failure_run_id }}
        run: package/release_ci_status_preflight "${{ github.repository }}" "${{ github.sha }}" "ci.yml" "$ACKNOWLEDGED_CI_FAILURE_RUN_ID"

  build:
    needs: validate_release_version
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          workspaces: engine

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install cross
        if: contains(matrix.target, '-linux-musl')
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build and package exact public release artifact
        shell: bash
        run: |
          set -euo pipefail
          source_tree="$(git rev-parse '${{ github.sha }}^{tree}')"
          package/build_release_artifact \
            public-all \
            "${{ matrix.target }}" \
            "${{ github.sha }}" \
            "$source_tree" \
            package/engine_compatibility.json \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: flapjack-${{ matrix.target }}
          path: |
            engine/flapjack-${{ matrix.target }}.tar.gz
            engine/flapjack-${{ matrix.target }}.tar.gz.sha256
            engine/flapjack-${{ matrix.target }}.zip
            engine/flapjack-${{ matrix.target }}.zip.sha256
            engine/flapjack-${{ matrix.target }}.manifest.json
            engine/flapjack-${{ matrix.target }}.build.json
          compression-level: 0

  engine_compatibility_gate:
    name: Verify exact engine upgrade compatibility (${{ matrix.target }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            qemu_platform: ""
          - target: aarch64-unknown-linux-musl
            qemu_platform: arm64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The release already uses this repository-owned QEMU/binfmt authority
      # for arm64 Docker fallback. Register only the arm64 interpreter here so
      # the same-data-dir smoke executes the real aarch64 release binaries.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        if: ${{ matrix.qemu_platform != '' }}
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: ${{ matrix.qemu_platform }}

      - uses: actions/download-artifact@v4
        with:
          name: flapjack-${{ matrix.target }}
          path: engine/compatibility-candidate

      - name: Prove every exact predecessor before publication
        working-directory: engine
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          target="${{ matrix.target }}"
          candidate_dir="compatibility-candidate"
          candidate_manifest="$candidate_dir/flapjack-${target}.manifest.json"
          candidate_archive="$candidate_dir/flapjack-${target}.tar.gz"
          scratch_dir="$(mktemp -d)"
          predecessors_file="$scratch_dir/predecessors.tsv"
          trap 'rm -rf "$scratch_dir"' EXIT

          # The helper validates canonical source equality and emits only the
          # exact releaseTag/manifestSha256/binarySha256/rollbackMode records.
          package/release_artifact_manifest \
            --compatibility-predecessors "$candidate_manifest" \
            >"$predecessors_file"

          IFS=$'\t' read -r candidate_archive_sha candidate_binary_sha < <(
            python3 - "$candidate_manifest" "$target" <<'PY'
          import json
          import pathlib
          import sys

          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          target = sys.argv[2]
          artifact = manifest["artifact"]
          if artifact["target"] != target or manifest["build"]["target"] != target:
              raise SystemExit("candidate target does not match compatibility target")
          print(artifact["sha256"], artifact["binarySha256"], sep="\t")
          PY
          )
          printf '%s  %s\n' "$candidate_archive_sha" "$candidate_archive" | sha256sum -c -
          mkdir -p "$scratch_dir/new"
          package/release_artifact_runtime_gate extract "$candidate_archive" "$scratch_dir/new"
          printf '%s  %s\n' "$candidate_binary_sha" "$scratch_dir/new/flapjack" | sha256sum -c -
          timeout --signal=TERM --kill-after=5s 15s package/release_artifact_runtime_gate attest "$scratch_dir/new/flapjack" "$candidate_manifest"

          if [ ! -s "$predecessors_file" ]; then
            echo "No in-place predecessor is claimed for ${target} by this release."
          fi

          while IFS=$'\t' read -r release_tag manifest_sha binary_sha rollback_mode; do
            [ -n "$release_tag" ] || continue
            old_dir="$scratch_dir/old-${release_tag}"
            mkdir -p "$old_dir/extracted"
            gh release download "$release_tag" \
              --repo "${{ github.repository }}" \
              --pattern "flapjack-${target}.manifest.json" \
              --pattern "flapjack-${target}.tar.gz" \
              --dir "$old_dir"

            old_manifest="$old_dir/flapjack-${target}.manifest.json"
            printf '%s  %s\n' "$manifest_sha" "$old_manifest" | sha256sum -c -

            IFS=$'\t' read -r old_archive_name old_archive_sha < <(
              python3 - "$old_manifest" "$release_tag" "$target" "$binary_sha" <<'PY'
          import json
          import pathlib
          import sys

          manifest_path = pathlib.Path(sys.argv[1])
          release_tag = sys.argv[2]
          target = sys.argv[3]
          expected_binary_sha = sys.argv[4]

          def reject_duplicate_keys(pairs):
              value = {}
              for key, member in pairs:
                  if key in value:
                      raise ValueError(f"duplicate predecessor manifest key: {key}")
                  value[key] = member
              return value

          manifest = json.loads(
              manifest_path.read_text(), object_pairs_hook=reject_duplicate_keys
          )
          schema_version = manifest.get("schemaVersion")
          expected_top = {
              1: {"schemaVersion", "artifact", "build"},
              2: {"schemaVersion", "artifact", "build", "compatibility"},
          }
          if schema_version not in expected_top or set(manifest) != expected_top[schema_version]:
              raise SystemExit("predecessor manifest schema or keys are unsupported")

          artifact = manifest["artifact"]
          expected_artifact = {"file", "target", "arch", "profile", "sha256"}
          if schema_version == 2:
              expected_artifact.add("binarySha256")
          if not isinstance(artifact, dict) or set(artifact) != expected_artifact:
              raise SystemExit("predecessor artifact keys are unsupported")
          expected_file = f"flapjack-{target}.tar.gz"
          if artifact["file"] != expected_file or artifact["target"] != target:
              raise SystemExit("predecessor artifact coordinates do not match the declaration")
          if artifact["arch"] != target.split("-", 1)[0] or artifact["profile"] != "release":
              raise SystemExit("predecessor artifact is not the declared release target build")

          build = manifest["build"]
          if build.get("version") != release_tag.removeprefix("v"):
              raise SystemExit("predecessor release tag does not match build.version")
          if build.get("target") != target or build.get("profile") != "release":
              raise SystemExit("predecessor build identity does not match the release target")
          if build.get("revisionKnown") is not True:
              raise SystemExit("predecessor build revision must be exact")
          if schema_version == 2 and artifact["binarySha256"] != expected_binary_sha:
              raise SystemExit("predecessor manifest binary digest diverges from compatibility")
          print(artifact["file"], artifact["sha256"], sep="\t")
          PY
            )

            old_archive="$old_dir/$old_archive_name"
            printf '%s  %s\n' "$old_archive_sha" "$old_archive" | sha256sum -c -
            package/release_artifact_runtime_gate extract "$old_archive" "$old_dir/extracted"
            old_binary="$old_dir/extracted/flapjack"
            printf '%s  %s\n' "$binary_sha" "$old_binary" | sha256sum -c -

            timeout --signal=TERM --kill-after=5s 90s \
              bash tests/upgrade_smoke.sh \
                --old-bin "$old_binary" \
                --old-manifest "$old_manifest" \
                --old-binary-sha256 "$binary_sha" \
                --new-bin "$scratch_dir/new/flapjack" \
                --new-manifest "$candidate_manifest" \
                --rollback-mode "$rollback_mode"
          done <"$predecessors_file"

  release:
    # All four are irreversibility gates: build proves the artifacts exist,
    # engine_compatibility_gate proves every claimed same-data-dir handoff,
    # ghcr_publish_preflight proves the images will be publishable, and
    # release_ci_status_preflight proves the target's push CI is terminal green
    # (or its exact failed run is acknowledged). Creating the tag before these
    # proofs is what leaves a partial release on the public mirror.
    needs: [build, engine_compatibility_gate, ghcr_publish_preflight, release_ci_status_preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create tag
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          # Idempotent on purpose: release.yml creates the tag here, BEFORE the
          # Docker promotion jobs run. A run that fails or stalls in the Docker
          # phase therefore leaves v${VERSION} already published. Re-dispatching
          # the workflow to finish that partial release must NOT abort at tag
          # creation, or a half-published release could never be completed via a
          # clean retry. If the tag already exists on origin, leave it in place
          # (the release/assets are anchored to it) and continue to the Docker
          # promotion jobs.
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists on origin; leaving it in place and continuing."
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Extract changelog release notes
        env:
          VERSION: ${{ github.event.inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          notes_file="release_notes.md"
          awk -v version="$VERSION" '
            index($0, "## [" version "] - ") == 1 {
              found = 1
              in_section = 1
              print
              next
            }

            in_section && index($0, "## [") == 1 {
              in_section = 0
            }

            in_section {
              print
            }

            END {
              if (!found) {
                exit 1
              }
            }
          ' CHANGELOG.md > "$notes_file"

          if [ ! -s "$notes_file" ]; then
            echo "ERROR: extracted release notes for ${VERSION} are empty" >&2
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          body_path: release_notes.md
          files: |
            flapjack-*.tar.gz
            flapjack-*.tar.gz.sha256
            flapjack-*.zip
            flapjack-*.zip.sha256
            flapjack-*.manifest.json
            flapjack-*.build.json

  docker_prepare:
    name: Docker tag source
    needs: release
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tags.outputs.image }}
      version_tag: ${{ steps.tags.outputs.version_tag }}
      latest_tag: ${{ steps.tags.outputs.latest_tag }}
      amd64_candidate_tag: ${{ steps.tags.outputs.amd64_candidate_tag }}
      arm64_candidate_tag: ${{ steps.tags.outputs.arm64_candidate_tag }}
      candidate_manifest_tag: ${{ steps.tags.outputs.candidate_manifest_tag }}
    steps:
      - name: Resolve canonical Docker tags
        id: tags
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          # Composed from the workflow-level coordinates so the preflight and the
          # publish jobs cannot drift onto different repositories.
          image="${RELEASE_REGISTRY}/${RELEASE_IMAGE_REPOSITORY}"
          version_tag="${image}:${VERSION}"
          latest_tag="${image}:latest"
          amd64_candidate_tag="${image}:${VERSION}-linux-amd64"
          arm64_candidate_tag="${image}:${VERSION}-linux-arm64"
          candidate_manifest_tag="${image}:${VERSION}-candidate"

          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${version_tag}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "amd64_candidate_tag=${amd64_candidate_tag}" >> "$GITHUB_OUTPUT"
          echo "arm64_candidate_tag=${arm64_candidate_tag}" >> "$GITHUB_OUTPUT"
          echo "candidate_manifest_tag=${candidate_manifest_tag}" >> "$GITHUB_OUTPUT"

  docker_build_amd64:
    name: Docker build linux/amd64
    needs: docker_prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Post-transfer GHCR package ownership is still not linked for Actions repo access.
      # Keep packages:write and use a PAT-backed GHCR_TOKEN until GitHub-side linking is fixed.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and publish amd64 candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: engine/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ needs.docker_prepare.outputs.amd64_candidate_tag }}
          build-args: |
            FLAPJACK_BUILD_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker_build_arm64_native:
    name: Docker build linux/arm64 (native)
    if: ${{ vars.ARM64_NATIVE_RUNNER != '' }}
    needs: docker_prepare
    runs-on: ${{ vars.ARM64_NATIVE_RUNNER }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and publish arm64 candidate image (native runner)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: engine/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ needs.docker_prepare.outputs.arm64_candidate_tag }}
          build-args: |
            FLAPJACK_BUILD_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker_build_arm64_qemu:
    name: Docker build linux/arm64 (qemu fallback)
    if: ${{ vars.ARM64_NATIVE_RUNNER == '' }}
    needs: docker_prepare
    runs-on: ubuntu-latest
    # QEMU emulates the entire arm64 Rust compile and is an order of magnitude
    # slower than a native runner; without a hard cap a stalled emulated build
    # hangs the whole release pipeline indefinitely (it did, repeatedly). Cap it
    # so a stuck build fails fast and surfaces instead of polling forever. Prefer
    # the native lane: set repo var ARM64_NATIVE_RUNNER (e.g. ubuntu-24.04-arm,
    # free on public repos) to skip this QEMU path entirely.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and publish arm64 candidate image (qemu fallback)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: engine/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ needs.docker_prepare.outputs.arm64_candidate_tag }}
          build-args: |
            FLAPJACK_BUILD_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker_manifest_verify:
    name: Verify candidate multi-arch manifest
    needs:
      - docker_prepare
      - docker_build_amd64
      - docker_build_arm64_native
      - docker_build_arm64_qemu
    if: ${{ always() && needs.docker_build_amd64.result == 'success' && (needs.docker_build_arm64_native.result == 'success' || needs.docker_build_arm64_qemu.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Assemble candidate manifest from arch tags
        run: |
          docker buildx imagetools create \
            -t "${{ needs.docker_prepare.outputs.candidate_manifest_tag }}" \
            "${{ needs.docker_prepare.outputs.amd64_candidate_tag }}" \
            "${{ needs.docker_prepare.outputs.arm64_candidate_tag }}"

      - name: Verify candidate manifest includes required linux architectures
        run: |
          set -euo pipefail
          inspect_output="$(docker buildx imagetools inspect "${{ needs.docker_prepare.outputs.candidate_manifest_tag }}")"
          printf '%s\n' "$inspect_output"
          echo "$inspect_output" | grep -q "linux/amd64"
          echo "$inspect_output" | grep -q "linux/arm64"

  docker_promote_stable:
    name: Promote verified manifest to stable tags
    needs:
      - docker_prepare
      - docker_manifest_verify
    # docker_manifest_verify guards itself with `always()` so it can run when the
    # unused arm64 lane (native OR qemu — one is always skipped) is skipped. That
    # skipped sibling otherwise transitively propagates a skip to THIS job's
    # implicit success() gate, silently skipping stable-tag promotion. That bug
    # bit run 26349967086: the multi-arch candidate was built and verified, but
    # :version/:latest were never published because this job was skipped. Mirror
    # the explicit guard: promote whenever verification actually succeeded.
    # (always() breaks the skip propagation; the result check keeps us from
    # promoting an unverified manifest.)
    if: ${{ always() && needs.docker_manifest_verify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Publish stable release tags from verified manifest
        run: |
          docker buildx imagetools create \
            -t "${{ needs.docker_prepare.outputs.version_tag }}" \
            -t "${{ needs.docker_prepare.outputs.latest_tag }}" \
            "${{ needs.docker_prepare.outputs.candidate_manifest_tag }}"
