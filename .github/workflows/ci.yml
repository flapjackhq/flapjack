name: CI

# CI runs on the public staging and prod repos only. The private dev repo
# must never run CI — it burns paid Actions minutes.
# Use `debbie sync staging` to push changes to the public repo where CI is free.
on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Guard: only run on recognized public repos. The private dev repo is
  # intentionally excluded — CI belongs on staging/prod where Actions is free.
  check-repo:
    runs-on: ubuntu-latest
    outputs:
      is-public-repo: ${{ steps.check.outputs.is-public-repo }}
    steps:
      - id: check
        run: |
          if [ "${{ github.repository }}" = "flapjackhq/flapjack" ] || [ "${{ github.repository }}" = "gridl-staging/flapjack" ]; then
            echo "is-public-repo=true" >> $GITHUB_OUTPUT
          else
            echo "is-public-repo=false" >> $GITHUB_OUTPUT
          fi
  # Shape contracts for the release path, and for CI-harness wiring that a browser
  # suite would otherwise only surface hours later. These are pure shell + python3 (no
  # cargo, no network), so they cost seconds. They ran nowhere until 2026-08-04,
  # which meant release.yml could drift out of contract silently — the release
  # is the one pipeline where a defect is discovered only after it is public.
  # The job name is deliberately unchanged: several operational checklists route
  # "a red Release contracts job" to a specific disposition, and that routing is worth
  # more than a name that matches the job's widened scope.
  release-contracts:
    name: Release contracts
    needs: check-repo
    if: needs.check-repo.outputs.is-public-repo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Public-ledger citation contract tests
        run: bash engine/tests/validate_public_ledger_citations_test.sh

      - name: Public-ledger citation oracle
        run: bash engine/tests/validate_public_ledger_citations.sh --mode mirror

      - name: Release workflow structure contract
        run: bash engine/tests/test_release_workflow_structure.sh

      - name: GHCR publish preflight contract
        run: bash engine/tests/test_ghcr_publish_preflight.sh

      # The only automated proof of the cross passthrough KAT's oracle and of its
      # DEFERRED-ENV classification boundary. It drives the KAT against mock
      # cross/timeout/docker binaries, so it needs no container and costs seconds.
      - name: Cross passthrough KAT supervision contract
        run: bash engine/tests/build_identity_cross_kat_supervision_test.sh

      # The behavioural half of REL-12. test_release_workflow_structure.sh already asserts
      # the preflight JOB's shape in release.yml; this proves the preflight's own decision
      # logic — terminal-success vs in-progress vs failure vs no-run, and the
      # acknowledgement path. It drives a fake `gh` on PATH, so it needs no network and
      # costs seconds. It landed invoked by nothing, which is the same inert-contract
      # failure the structure test's own header records.
      # GH_TOKEN is required, not optional: the contract drives the preflight against
      # live pinned runs in flapjackhq/flapjack, so an unauthenticated `gh` fails 17 of
      # its 41 cases and aborts this whole job — taking the later contract steps with it.
      # This step existed twice for one day (ad2cacbb2 duplicated b2ede54ea rather than
      # editing it) and only the copy without the token was reached second; staging run
      # 31213083385 is the specimen. test_dashboard_e2e_backend_contract.py now fails a
      # duplicated step name so an addition-instead-of-edit cannot land silently again.
      - name: Release CI-status preflight contract
        run: GH_TOKEN="${{ github.token }}" bash engine/tests/test_release_ci_status_preflight.sh

      # Holds every job that starts a backend and then runs dashboard e2e specs to the
      # capability environment those specs declare. Two separate CI failures on
      # 2026-08-06 (nightly cluster_peers, prod-CI vector-settings) came from that wiring
      # drifting, and neither was visible until a browser suite had been running for
      # minutes.
      - name: Dashboard e2e backend contract
        run: python3 engine/tests/test_dashboard_e2e_backend_contract.py

      # This manifest is the fail-closed bridge between test classes and their
      # minimum execution tiers. A new workflow job or ignored Rust test must be
      # classified before the public quick signal can turn green.
      - name: Test-tier ownership contract
        run: python3 engine/tests/test_ci_test_tiers.py --verify

      - name: Candidate binary handoff contract
        run: python3 engine/tests/test_extract_candidate_binary.py

  # ============================================================================
  # RUST ENGINE TESTS
  # ============================================================================

  fmt:
    name: Rustfmt
    needs: check-repo
    if: needs.check-repo.outputs.is-public-repo == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    needs: check-repo
    if: needs.check-repo.outputs.is-public-repo == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: engine
      - name: Create dashboard dist stub (for RustEmbed)
        run: mkdir -p dashboard/dist && echo '<html></html>' > dashboard/dist/index.html
      - name: Clippy (with vector-search)
        run: >
          cargo clippy
          -p flapjack -p flapjack-http -p flapjack-server
          --all-targets --features vector-search
          -- -D warnings
          -W clippy::cognitive_complexity
      - name: Clippy (remaining crates)
        run: >
          cargo clippy
          -p flapjack-ssl -p flapjack-replication
          --all-targets
          -- -D warnings
          -W clippy::cognitive_complexity

  rust-tests-fast:
    name: Rust candidate (fast)
    needs: check-repo
    if: needs.check-repo.outputs.is-public-repo == 'true'
    runs-on: ubuntu-latest
    env:
      CACHE_ON_FAILURE: true
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -C debuginfo=0
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: engine
      - name: Create dashboard dist stub (for RustEmbed)
        run: mkdir -p dashboard/dist && echo '<html></html>' > dashboard/dist/index.html
      # Compile outside the behavioral timeout. If the cache is cold, this step
      # reports cold compilation honestly instead of consuming the test budget.
      - name: Build candidate core test binary
        id: candidate-build
        timeout-minutes: 30
        run: cargo test -p flapjack --lib --no-run --message-format=json > candidate_build.json && python3 tests/extract_candidate_binary.py candidate_build.json "$GITHUB_OUTPUT"
      - name: Candidate test-tier inventory
        timeout-minutes: 10
        run: python3 tests/test_ci_test_tiers.py --verify
      # The narrower core is intentionally in-process: it passed as a 2,277-test
      # specimen, while flapjack-http and vector-feature library unions showed
      # process-global interference. Those surfaces stay in isolated nextest.
      - name: Candidate core tests
        timeout-minutes: 6
        run: timeout --kill-after=60s 300s "${{ steps.candidate-build.outputs.executable }}"

  rust-tests-all:
    name: Rust tests (all)
    needs: check-repo
    if: needs.check-repo.outputs.is-public-repo == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CACHE_ON_FAILURE: true
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -C debuginfo=0
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h
        working-directory: .
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: engine
      - uses: taiki-e/install-action@a93b01ec36baa756f8701f3a0a8daa54a46d6339 # nextest
      - name: Install cargo audit/deny tools for security audit tests
        uses: taiki-e/install-action@a93b01ec36baa756f8701f3a0a8daa54a46d6339 # cargo-audit,cargo-deny
        with:
          tool: cargo-audit,cargo-deny
          fallback: none
      - name: Create dashboard dist stub (for RustEmbed)
        run: mkdir -p dashboard/dist && echo '<html></html>' > dashboard/dist/index.html
      - name: Build binaries (needed by integration tests)
        timeout-minutes: 30
        run: cargo build --package flapjack-server --features vector-search
      - name: Build vector-search test binaries
        timeout-minutes: 30
        # Use Nextest's exact test profile so the following execution-only
        # timeout cannot silently spend its budget recompiling dev artifacts.
        run: cargo nextest run -p flapjack -p flapjack-http --features vector-search -P ci --no-run
      - name: All tests (vector-search)
        timeout-minutes: 20
        run: cargo nextest run -p flapjack -p flapjack-http --features vector-search -P ci --no-fail-fast
      - name: Build remaining test binaries
        timeout-minutes: 30
        # Preserve the lean/default feature contract, but keep cold compilation
        # outside the bounded execution step just as the vector lane does.
        run: cargo nextest run -p flapjack-server -p flapjack-ssl -p flapjack-replication -P ci --no-run
      - name: All tests (remaining)
        timeout-minutes: 10
        run: cargo nextest run -p flapjack-server -p flapjack-ssl -p flapjack-replication -P ci --no-fail-fast

  # ============================================================================
  # BUILD SERVER (shared by SDK e2e tests)
  # ============================================================================

  build-server:
    name: Build server binary
    needs: check-repo
    if: needs.check-repo.outputs.is-public-repo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: engine
      - name: Create dashboard dist stub (for RustEmbed)
        working-directory: engine
        run: mkdir -p dashboard/dist && echo '<html></html>' > dashboard/dist/index.html
      - name: Build server
        working-directory: engine
        run: cargo build --package flapjack-server --features vector-search
      - name: Upload server binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flapjack-server
          path: engine/target/debug/flapjack
          retention-days: 1

  # ============================================================================
  # INTEGRATION SMOKE TEST
  # ============================================================================

  integration-smoke:
    name: Integration smoke
    needs: [check-repo, build-server]
    if: needs.check-repo.outputs.is-public-repo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download server binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flapjack-server
          path: /tmp/flapjack
      - name: Run integration smoke harness
        run: |
          set -o pipefail
          chmod +x /tmp/flapjack/flapjack
          SMOKE_LOG="$RUNNER_TEMP/integration-smoke.log"
          FLAPJACK_BIN=/tmp/flapjack/flapjack bash engine/tests/integration_smoke.sh 2>&1 | tee "$SMOKE_LOG"
      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-smoke-log
          path: ${{ runner.temp }}/integration-smoke.log
          retention-days: 7

  console:
    name: Svelte console conformance
    needs: [check-repo, build-server]
    if: needs.check-repo.outputs.is-public-repo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download server binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flapjack-server
          path: /tmp/flapjack
      - name: Start Flapjack server
        run: |
          chmod +x /tmp/flapjack/flapjack
          mkdir -p /tmp/flapjack-console-data
          SERVER_LOG=/tmp/flapjack-console-data/server.log
          FLAPJACK_ADMIN_KEY=fj_devtestadminkey000000 \
            /tmp/flapjack/flapjack --data-dir /tmp/flapjack-console-data >"$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          bash engine/tests/common/wait_for_flapjack.sh --pid "$SERVER_PID" --host localhost --port 7700 --log-path "$SERVER_LOG"
          echo "FJ_CONSOLE_TEST_INSTANCE_TOKEN=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: engine/console/package-lock.json
      - name: Install console dependencies
        working-directory: engine/console
        run: npm ci
      - name: Install console Playwright browser
        working-directory: engine/console
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Run exact console checks
        working-directory: engine/console
        run: |
          npm run test:unit:run
          npm run check
          npm run build
          npm run lint:browser-tests:unmocked
          npm run test:browser:unmocked
      - name: Upload console browser failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: console-browser-failures
          path: |
            engine/console/test-results/
            engine/console/playwright-report/
          retention-days: 7

  # ============================================================================
  # DASHBOARD TESTS
  # ============================================================================

  dashboard-unit:
    name: Dashboard unit tests
    needs: check-repo
    if: needs.check-repo.outputs.is-public-repo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: engine/dashboard/package-lock.json
      - name: Install dependencies
        working-directory: engine/dashboard
        run: npm install
      - name: Run unit tests
        working-directory: engine/dashboard
        run: npm run test:unit:run

  dashboard-build:
    name: Dashboard build
    needs: check-repo
    if: needs.check-repo.outputs.is-public-repo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: engine/dashboard/package-lock.json
      - name: Install dependencies
        working-directory: engine/dashboard
        run: npm install
      - name: Validate JOIN proof manifest
        working-directory: engine/dashboard
        run: npm run check:join-manifest
      - name: Test production audit policy
        working-directory: engine/dashboard
        run: bash scripts/audit_gate_fixture_test.sh
      - name: Audit production dependencies
        working-directory: engine/dashboard
        run: bash scripts/audit_gate.sh
      - name: Type check & build
        working-directory: engine/dashboard
        run: npm run build

  dashboard-pages:
    name: Dashboard page tests
    needs: [check-repo, build-server]
    if: needs.check-repo.outputs.is-public-repo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download server binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flapjack-server
          path: /tmp/flapjack
      - name: Start Flapjack server
        run: |
          chmod +x /tmp/flapjack/flapjack
          mkdir -p /tmp/flapjack-data
          SERVER_LOG=/tmp/flapjack-data/server.log
          # Base backend requirements, owned by
          # engine/dashboard/tests/e2e_backend_contract.json and enforced by
          # engine/tests/test_dashboard_e2e_backend_contract.py. assertBackendReadiness
          # probes for these on EVERY backend the harness accepts, so this job needs them
          # even though it selects none of the specs that name them: without them
          # Playwright's webServer refuses to start and NO spec runs. They must be set
          # HERE and not on the Playwright step, because Playwright reuses a backend that
          # is already listening and spawnBackendServer never runs.
          FLAPJACK_ADMIN_KEY=fj_devtestadminkey000000 \
          FLAPJACK_NODE_ID=dashboard-e2e \
          FLAPJACK_ADVERTISE_ADDR=https://dashboard-e2e.invalid:7700 \
          FLAPJACK_REPLICATION_API_KEY=fj_devtestadminkey000000 \
          FLAPJACK_AI_ALLOW_LOCAL_URLS=1 \
            /tmp/flapjack/flapjack --data-dir /tmp/flapjack-data >"$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          bash engine/tests/common/wait_for_flapjack.sh --pid "$SERVER_PID" --host localhost --port 7700 --log-path "$SERVER_LOG"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: engine/dashboard/package-lock.json
      - name: Install dependencies
        working-directory: engine/dashboard
        run: npm install
      - name: Install dashboard page Playwright browser
        working-directory: engine/dashboard
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Run page tests
        working-directory: engine/dashboard
        run: npm run test:e2e-ui:smoke
      - name: Upload test report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dashboard-pages-report
          path: engine/dashboard/playwright-report/
          retention-days: 7

  dashboard-full-e2e:
    name: Dashboard full e2e tests
    needs: [check-repo, build-server]
    if: needs.check-repo.outputs.is-public-repo == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download server binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flapjack-server
          path: /tmp/flapjack
      - name: Start Flapjack server
        run: |
          chmod +x /tmp/flapjack/flapjack
          mkdir -p /tmp/flapjack-data
          SERVER_LOG=/tmp/flapjack-data/server.log
          # Backend capability environment is owned by
          # engine/dashboard/tests/e2e_backend_contract.json and enforced by
          # engine/tests/test_dashboard_e2e_backend_contract.py. It must be set HERE and
          # not on the Playwright step: Playwright reuses a backend that is already
          # listening, so spawnBackendServer never runs and env declared on the test step
          # cannot reach the process under test.
          FLAPJACK_ADMIN_KEY=fj_devtestadminkey000000 \
          FLAPJACK_NODE_ID=dashboard-e2e \
          FLAPJACK_ADVERTISE_ADDR=https://dashboard-e2e.invalid:7700 \
          FLAPJACK_REPLICATION_API_KEY=fj_devtestadminkey000000 \
          FLAPJACK_AI_ALLOW_LOCAL_URLS=1 \
          FJ_ENABLE_MEILISEARCH_PREVIEW_LOOPBACK=1 \
          FJ_ENABLE_TYPESENSE_PREVIEW_LOOPBACK=1 \
            /tmp/flapjack/flapjack --data-dir /tmp/flapjack-data >"$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          bash engine/tests/common/wait_for_flapjack.sh --pid "$SERVER_PID" --host localhost --port 7700 --log-path "$SERVER_LOG"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: engine/dashboard/package-lock.json
      - name: Install dependencies
        working-directory: engine/dashboard
        run: npm install
      - name: Install dashboard full Playwright browser
        working-directory: engine/dashboard
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Run full e2e tests
        working-directory: engine/dashboard
        run: npm run test:e2e-ui:full
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
      - name: Upload test report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dashboard-full-e2e-report
          path: engine/dashboard/playwright-report/
          retention-days: 7

  dashboard-integration:
    name: Dashboard integration tests
    needs: [check-repo, build-server]
    if: needs.check-repo.outputs.is-public-repo == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download server binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flapjack-server
          path: /tmp/flapjack
      - name: Start Flapjack server
        run: |
          chmod +x /tmp/flapjack/flapjack
          mkdir -p /tmp/flapjack-data
          SERVER_LOG=/tmp/flapjack-data/server.log
          # Base backend requirements, owned by
          # engine/dashboard/tests/e2e_backend_contract.json and enforced by
          # engine/tests/test_dashboard_e2e_backend_contract.py. assertBackendReadiness
          # probes for these on EVERY backend the harness accepts, so this job needs them
          # even though it selects none of the specs that name them: without them
          # Playwright's webServer refuses to start and NO spec runs. They must be set
          # HERE and not on the Playwright step, because Playwright reuses a backend that
          # is already listening and spawnBackendServer never runs.
          FLAPJACK_ADMIN_KEY=fj_devtestadminkey000000 \
          FLAPJACK_NODE_ID=dashboard-e2e \
          FLAPJACK_ADVERTISE_ADDR=https://dashboard-e2e.invalid:7700 \
          FLAPJACK_REPLICATION_API_KEY=fj_devtestadminkey000000 \
          FLAPJACK_AI_ALLOW_LOCAL_URLS=1 \
            /tmp/flapjack/flapjack --data-dir /tmp/flapjack-data >"$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          bash engine/tests/common/wait_for_flapjack.sh --pid "$SERVER_PID" --host localhost --port 7700 --log-path "$SERVER_LOG"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: engine/dashboard/package-lock.json
      - name: Install dependencies
        working-directory: engine/dashboard
        run: npm install
      - name: Install dashboard integration Playwright browser
        working-directory: engine/dashboard
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Run integration tests
        working-directory: engine/dashboard
        run: npm run test:integration
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
      - name: Upload test report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dashboard-integration-report
          path: engine/dashboard/playwright-report/
          retention-days: 7

  # ============================================================================
  # SDK TESTS
  # ============================================================================

  sdk-php:
    name: PHP SDK tests
    needs: [check-repo, build-server]
    if: needs.check-repo.outputs.is-public-repo == 'true'
    runs-on: ubuntu-latest
    env:
      FLAPJACK_APP_ID: test-app
      FLAPJACK_API_KEY: test-api-key
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download server binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flapjack-server
          path: /tmp/flapjack
      - name: Start Flapjack server
        run: |
          chmod +x /tmp/flapjack/flapjack
          mkdir -p /tmp/flapjack-data
          SERVER_LOG=/tmp/flapjack-data/server.log
          FLAPJACK_ADMIN_KEY="$FLAPJACK_API_KEY" /tmp/flapjack/flapjack --data-dir /tmp/flapjack-data >"$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          bash engine/tests/common/wait_for_flapjack.sh --pid "$SERVER_PID" --host localhost --port 7700 --log-path "$SERVER_LOG"
      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, json
      - name: Install dependencies
        working-directory: sdks/php
        run: composer install --no-interaction --prefer-dist
      - name: Run tests
        working-directory: sdks/php
        run: vendor/bin/phpunit

  sdk-python:
    name: Python SDK tests
    needs: [check-repo, build-server]
    if: needs.check-repo.outputs.is-public-repo == 'true'
    runs-on: ubuntu-latest
    env:
      FLAPJACK_APP_ID: test-app
      FLAPJACK_API_KEY: test-api-key
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download server binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flapjack-server
          path: /tmp/flapjack
      - name: Start Flapjack server
        run: |
          chmod +x /tmp/flapjack/flapjack
          mkdir -p /tmp/flapjack-data
          SERVER_LOG=/tmp/flapjack-data/server.log
          FLAPJACK_ADMIN_KEY="$FLAPJACK_API_KEY" /tmp/flapjack/flapjack --data-dir /tmp/flapjack-data >"$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          bash engine/tests/common/wait_for_flapjack.sh --pid "$SERVER_PID" --host localhost --port 7700 --log-path "$SERVER_LOG"
      - name: Install Poetry
        run: pipx install poetry
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'poetry'
      - name: Install dependencies
        working-directory: sdks/python
        run: poetry install
      - name: Run tests
        working-directory: sdks/python
        run: poetry run pytest

  sdk-javascript:
    name: JavaScript SDK tests
    needs: check-repo
    if: needs.check-repo.outputs.is-public-repo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Enable corepack (for yarn)
        run: corepack enable
      - name: Install dependencies
        working-directory: sdks/javascript
        run: yarn install
      - name: Build packages
        working-directory: sdks/javascript
        run: yarn build
      - name: Run tests
        working-directory: sdks/javascript/packages/flapjack-search
        run: yarn test

  sdk-contract:
    name: SDK contract tests
    needs: [check-repo, build-server]
    if: needs.check-repo.outputs.is-public-repo == 'true'
    runs-on: ubuntu-latest
    env:
      FLAPJACK_ADMIN_KEY: fj_devtestadminkey000000
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download server binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flapjack-server
          path: /tmp/flapjack
      - name: Start Flapjack server
        run: |
          chmod +x /tmp/flapjack/flapjack
          mkdir -p /tmp/flapjack-data
          SERVER_LOG=/tmp/flapjack-data/server.log
          FLAPJACK_ADMIN_KEY="$FLAPJACK_ADMIN_KEY" /tmp/flapjack/flapjack --data-dir /tmp/flapjack-data >"$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          bash engine/tests/common/wait_for_flapjack.sh --pid "$SERVER_PID" --host localhost --port 7700 --log-path "$SERVER_LOG"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: engine/sdk_test/package-lock.json
      - name: Install dependencies
        working-directory: engine/sdk_test
        run: npm ci
      - name: Run contract tests
        working-directory: engine/sdk_test
        run: npm run test:contract
        env:
          FLAPJACK_URL: http://localhost:7700
      - name: Install SDK Playwright browser
        working-directory: engine/sdk_test
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: SDK real-client conformance
        working-directory: engine/sdk_test
        run: |
          npm run test:real_clients:wiring
          npm run lint:real_clients
          npm run test:real_clients
        env:
          FLAPJACK_URL: http://localhost:7700

  sdk-go:
    name: Go SDK tests
    needs: check-repo
    if: needs.check-repo.outputs.is-public-repo == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.21', '1.22', '1.23']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
      - name: Run unit tests
        working-directory: sdks/go
        run: go test ./flapjack/...

  sdk-go-e2e:
    name: Go SDK e2e tests
    needs: [check-repo, build-server]
    if: needs.check-repo.outputs.is-public-repo == 'true'
    runs-on: ubuntu-latest
    env:
      FLAPJACK_APP_ID: test-app
      FLAPJACK_API_KEY: test-api-key
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download server binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flapjack-server
          path: /tmp/flapjack
      - name: Start Flapjack server
        run: |
          chmod +x /tmp/flapjack/flapjack
          mkdir -p /tmp/flapjack-data
          SERVER_LOG=/tmp/flapjack-data/server.log
          FLAPJACK_ADMIN_KEY="$FLAPJACK_API_KEY" /tmp/flapjack/flapjack --data-dir /tmp/flapjack-data >"$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          bash engine/tests/common/wait_for_flapjack.sh --pid "$SERVER_PID" --host localhost --port 7700 --log-path "$SERVER_LOG"
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'
      - name: Run e2e tests
        working-directory: sdks/go
        run: go test ./tests/...

  sdk-ruby:
    name: Ruby SDK tests
    needs: [check-repo, build-server]
    if: needs.check-repo.outputs.is-public-repo == 'true'
    runs-on: ubuntu-latest
    env:
      FLAPJACK_APP_ID: test-app
      FLAPJACK_API_KEY: test-api-key
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download server binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flapjack-server
          path: /tmp/flapjack
      - name: Start Flapjack server
        run: |
          chmod +x /tmp/flapjack/flapjack
          mkdir -p /tmp/flapjack-data
          SERVER_LOG=/tmp/flapjack-data/server.log
          FLAPJACK_ADMIN_KEY="$FLAPJACK_API_KEY" /tmp/flapjack/flapjack --data-dir /tmp/flapjack-data >"$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          bash engine/tests/common/wait_for_flapjack.sh --pid "$SERVER_PID" --host localhost --port 7700 --log-path "$SERVER_LOG"
      - name: Setup Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: sdks/ruby
      - name: Run tests
        working-directory: sdks/ruby
        run: bundle exec rake test

  sdk-java:
    name: Java SDK tests
    needs: [check-repo, build-server]
    if: needs.check-repo.outputs.is-public-repo == 'true'
    runs-on: ubuntu-latest
    env:
      FLAPJACK_APP_ID: test-app
      FLAPJACK_API_KEY: test-api-key
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download server binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flapjack-server
          path: /tmp/flapjack
      - name: Start Flapjack server
        run: |
          chmod +x /tmp/flapjack/flapjack
          mkdir -p /tmp/flapjack-data
          SERVER_LOG=/tmp/flapjack-data/server.log
          FLAPJACK_ADMIN_KEY="$FLAPJACK_API_KEY" /tmp/flapjack/flapjack --data-dir /tmp/flapjack-data >"$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          bash engine/tests/common/wait_for_flapjack.sh --pid "$SERVER_PID" --host localhost --port 7700 --log-path "$SERVER_LOG"
      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Run tests
        working-directory: sdks/java
        run: ./gradlew test

  sdk-csharp:
    name: C# SDK tests
    needs: [check-repo, build-server]
    if: needs.check-repo.outputs.is-public-repo == 'true'
    runs-on: ubuntu-latest
    env:
      FLAPJACK_APP_ID: test-app
      FLAPJACK_API_KEY: test-api-key
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download server binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flapjack-server
          path: /tmp/flapjack
      - name: Start Flapjack server
        run: |
          chmod +x /tmp/flapjack/flapjack
          mkdir -p /tmp/flapjack-data
          SERVER_LOG=/tmp/flapjack-data/server.log
          FLAPJACK_ADMIN_KEY="$FLAPJACK_API_KEY" /tmp/flapjack/flapjack --data-dir /tmp/flapjack-data >"$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          bash engine/tests/common/wait_for_flapjack.sh --pid "$SERVER_PID" --host localhost --port 7700 --log-path "$SERVER_LOG"
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        working-directory: sdks/csharp
        run: dotnet restore
      - name: Run tests
        working-directory: sdks/csharp
        run: dotnet test

  # ============================================================================
  # INTEGRATION TESTS
  # ============================================================================

  integration-laravel-scout:
    name: Laravel Scout tests
    needs: [check-repo, build-server]
    if: needs.check-repo.outputs.is-public-repo == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check if tests exist
        id: check-tests
        run: |
          if [ -d "integrations/laravel-scout/src" ] && [ -d "integrations/laravel-scout/tests" ]; then
            echo "has-tests=true" >> $GITHUB_OUTPUT
          else
            echo "has-tests=false" >> $GITHUB_OUTPUT
            echo "::warning::Laravel Scout src/ or tests/ directory not found, skipping tests"
          fi
      - name: Download server binary
        if: steps.check-tests.outputs.has-tests == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flapjack-server
          path: /tmp/flapjack
      - name: Start Flapjack server
        if: steps.check-tests.outputs.has-tests == 'true'
        run: |
          chmod +x /tmp/flapjack/flapjack
          mkdir -p /tmp/flapjack-data
          SERVER_LOG=/tmp/flapjack-data/server.log
          /tmp/flapjack/flapjack --no-auth --data-dir /tmp/flapjack-data >"$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          bash engine/tests/common/wait_for_flapjack.sh --pid "$SERVER_PID" --host localhost --port 7700 --log-path "$SERVER_LOG"
      - name: Setup PHP
        if: steps.check-tests.outputs.has-tests == 'true'
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, json
      - name: Install dependencies
        if: steps.check-tests.outputs.has-tests == 'true'
        working-directory: integrations/laravel-scout
        run: composer install --no-interaction --prefer-dist
      - name: Run tests
        if: steps.check-tests.outputs.has-tests == 'true'
        working-directory: integrations/laravel-scout
        run: vendor/bin/phpunit

  integration-wordpress:
    name: WordPress plugin tests
    needs: check-repo
    if: needs.check-repo.outputs.is-public-repo == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Checkout PHP SDK
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: temp-php-sdk
      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, json
      - name: Copy PHP SDK
        run: |
          mkdir -p sdks/php
          cp -r temp-php-sdk/sdks/php/* sdks/php/ || true
      - name: Install dependencies
        working-directory: sdks/wordpress
        run: composer install --no-interaction --prefer-dist
      - name: Run unit tests
        working-directory: sdks/wordpress
        run: composer run test:unit
      - name: Run integration tests
        working-directory: sdks/wordpress
        run: composer run test:integration
