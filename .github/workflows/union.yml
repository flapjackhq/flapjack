name: In-Process Union

# The IN-PROCESS workspace union: `cargo test --workspace --no-fail-fast`.
#
# Why this exists as its own workflow, since every other Rust job here is faster and greener:
#
# Every other Rust job in this repository runs `cargo nextest run` — ci.yml and nightly.yml's
# `Rust all tests`. nextest gives each test its OWN PROCESS. That is why the suite is green in
# ~16 minutes, and it is also why those jobs are structurally incapable of observing the bug class
# ROADMAP.md rows TEST-FLAKE-1, TEST-FLAKE-2 and TEST-FLAKE-3 exist for: one test mutating
# process-global state and corrupting another test's assertion. With one process per test there is
# no shared process to leak through. ROADMAP.md states this directly — Linux nextest passing
# ~5,800 process-isolated tests does NOT refute the in-process union red.
#
# Until this job, the only run that could see those defects was a ~2.5-hour `cargo test --workspace`
# on one shared developer Mac, contended by every other agent session on the host. It failed to
# complete twice for want of wall-clock (UNION_EXIT=124) while green nextest runs looked like
# reassurance the whole time.
#
# WHY NOT A JOB INSIDE nightly.yml, which is the obvious home:
# the union is EXPECTED RED today — that is precisely why those three rows are open. A red job in
# nightly.yml would flip that workflow's conclusion to `failure`, which would (a) reset NIGHT-1,
# whose exit is two consecutive green SCHEDULED nightly runs, and (b) fail SYNC-1's gate clause `b`
# (`nightly_success`), the gate currently holding the production publish. That would hold the
# release hostage to a flake investigation. Separate question, separate workflow, separate
# conclusion — this workflow may be red for as long as it takes without blocking anything else.
#
# It is deliberately NOT continue-on-error. A gate that cannot fail is not a gate; this repository
# has already found three inert contracts that way. The union's redness must turn THIS workflow red.
#
# Wiring is asserted by engine/tests/union_recurring_gate_test.rs, which reds if the job is removed,
# renamed, restricted to workflow_dispatch, switched to nextest, or made continue-on-error.

on:
  schedule:
    # 06:00 UTC — deliberately four hours after nightly.yml's 02:00 so the two do not contend for
    # runner capacity, and so a nightly failure is already visible before this starts.
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual triggering

env:
  CARGO_TERM_COLOR: always
  # Matches the local union doctrine in ROADMAP.md row TEST-FLAKE-1: incremental artifacts are a
  # known confounder for union-only reds, and the standing discriminator for any union failure is a
  # run from a clean tree at CARGO_INCREMENTAL=0. A CI runner is already clean; this keeps the
  # remote run comparable to the local one rather than subtly different from it.
  CARGO_INCREMENTAL: 0

jobs:
  # Guard: only run in the public product repository. Candidate pushes use ci.yml;
  # this expensive recurring diagnostic remains separate from the merge gate.
  check-repo:
    runs-on: ubuntu-latest
    outputs:
      is-public-repo: ${{ steps.check.outputs.is-public-repo }}
    steps:
      - id: check
        env:
          ACTUAL_REPOSITORY: ${{ github.repository }}
          ACTUAL_REF: ${{ github.ref }}
        run: |
          if [ "$ACTUAL_REPOSITORY" = "flapjackhq/flapjack" ] && [ "$ACTUAL_REF" = "refs/heads/main" ]; then
            echo "is-public-repo=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-public-repo=false" >> "$GITHUB_OUTPUT"
          fi

  rust-in-process-union:
    name: Rust in-process union
    needs: check-repo
    if: needs.check-repo.outputs.is-public-repo == 'true'
    runs-on: ubuntu-latest
    # Locally measured at ~85 min of test execution after compile (32 binaries in ~31 min on a
    # contended host). A dedicated runner should be well inside this; if it is ever hit, that is a
    # signal to investigate, not to raise the number.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h
        working-directory: .
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: engine
      # The union runs the SAME test set as nightly's `Rust all tests`, which includes security
      # audit tests that shell out to these binaries. Without them those tests fail on a missing
      # tool and the failure would be misattributed to the union's shared-state hypothesis — the
      # exact misattribution this job exists to prevent.
      - name: Install cargo audit/deny tools for security audit tests
        uses: taiki-e/install-action@a93b01ec36baa756f8701f3a0a8daa54a46d6339 # cargo-audit,cargo-deny
        with:
          tool: cargo-audit,cargo-deny
          fallback: none
      - name: Create dashboard dist stub (for RustEmbed)
        run: mkdir -p dashboard/dist && echo '<html></html>' > dashboard/dist/index.html
      # No nextest. That substitution is what makes this job pointless while leaving it green;
      # union_recurring_gate_test.rs asserts the string "nextest" appears nowhere in this job.
      - name: Run in-process workspace union
        run: cargo test --workspace --no-fail-fast
