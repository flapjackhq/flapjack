name: Rust tests

on:
  workflow_call:
    inputs:
      source-ref:
        type: string
        default: ''
      workspace:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -C debuginfo=0

jobs:
  build:
    name: Archive (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(inputs.workspace && '["workspace"]' || '["vector", "remaining"]') }}
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Free disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h .
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Preserve workflow-owned test configuration
        run: cp .config/nextest.toml "$RUNNER_TEMP/nextest.toml"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: inputs.source-ref != ''
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false
      - name: Verify the requested source revision
        if: inputs.source-ref != ''
        env:
          EXPECTED_SHA: ${{ inputs.source-ref }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Feature-lane dependency cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: engine
          cache-on-failure: true
          # Vector changes dependency features; default lanes reuse the established cache.
          shared-key: ${{ matrix.lane == 'vector' && 'rust-tests-vector' || 'archive-remaining-build' }}
      - uses: taiki-e/install-action@a93b01ec36baa756f8701f3a0a8daa54a46d6339 # nextest
      - name: Build and archive tests once per feature lane
        timeout-minutes: 60
        env:
          LANE: ${{ matrix.lane }}
        run: |
          mkdir -p dashboard/dist/assets
          echo '<html></html>' > dashboard/dist/index.html
          case "$LANE" in
            vector)
              cargo build --locked -p flapjack-server --features vector-search
              cargo nextest archive --config-file "$RUNNER_TEMP/nextest.toml" --locked -p flapjack -p flapjack-http --features vector-search -P ci --archive-file tests.tar.zst
              ;;
            remaining)
              cargo build --locked -p flapjack-server
              cargo nextest archive --config-file "$RUNNER_TEMP/nextest.toml" --locked -p flapjack-server -p flapjack-ssl -p flapjack-replication -P ci --archive-file tests.tar.zst
              ;;
            workspace)
              cargo build --locked -p flapjack-server
              cargo nextest archive --config-file "$RUNNER_TEMP/nextest.toml" --locked --workspace -P ci --archive-file tests.tar.zst
              ;;
            *) exit 1 ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-tests-${{ matrix.lane }}
          path: engine/tests.tar.zst
          if-no-files-found: error
          retention-days: 1

  test:
    name: Tests (${{ matrix.lane }}, ${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.workspace && 60 || 35 }}
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(inputs.workspace && '["workspace"]' || '["vector", "remaining"]') }}
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Free disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h .
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Preserve workflow-owned test configuration
        run: cp .config/nextest.toml "$RUNNER_TEMP/nextest.toml"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: inputs.source-ref != ''
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false
      - name: Verify the requested source revision
        if: inputs.source-ref != ''
        env:
          EXPECTED_SHA: ${{ inputs.source-ref }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: taiki-e/install-action@a93b01ec36baa756f8701f3a0a8daa54a46d6339 # nextest
      - name: Install audit tools used by security tests
        uses: taiki-e/install-action@a93b01ec36baa756f8701f3a0a8daa54a46d6339
        with:
          tool: cargo-audit,cargo-deny
          fallback: none
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-tests-${{ matrix.lane }}
          path: engine
      - name: Run the complete shard from the archive
        timeout-minutes: ${{ matrix.lane == 'remaining' && 10 || matrix.lane == 'workspace' && 45 || 20 }}
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          cargo nextest run --config-file "$RUNNER_TEMP/nextest.toml" -P ci --no-fail-fast
          --archive-file tests.tar.zst --workspace-remap "$PWD" --extract-to "$PWD"
          --partition "hash:${SHARD}/4"
