name: Private CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Private candidate gate
    if: github.repository == 'gridl-dev/flapjack_dev'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      rust-needed: ${{ steps.paths.outputs.rust-needed }}
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -C debuginfo=0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI routing and aggregate regression tests
        run: python3 -m unittest discover -s .github/scripts -p '*_test.py'
      - name: Test-tier ownership contracts
        run: python3 engine/tests/test_ci_test_tiers.py
      - name: CI execution budget contracts
        run: bash engine/tests/ci_test_timeout_cap_acceptance.sh
      - name: Backend environment contracts
        run: python3 engine/tests/test_dashboard_e2e_backend_contract.py
      - name: Rust test routing
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/ci_paths.py
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - name: Rustfmt
        working-directory: engine
        run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: steps.paths.outputs.rust-needed == 'true'
        with:
          workspaces: engine
          cache-on-failure: true
      - name: Create dashboard dist stub (for RustEmbed)
        if: steps.paths.outputs.rust-needed == 'true'
        working-directory: engine
        run: mkdir -p dashboard/dist/assets && echo '<html></html>' > dashboard/dist/index.html
      - name: Build candidate core test binary
        if: steps.paths.outputs.rust-needed == 'true'
        id: candidate-build
        timeout-minutes: 30
        working-directory: engine
        run: >-
          cargo test -p flapjack --lib --no-run --message-format=json > candidate_build.json &&
          python3 tests/extract_candidate_binary.py candidate_build.json "$GITHUB_OUTPUT"
      - name: Candidate core tests
        if: steps.paths.outputs.rust-needed == 'true'
        timeout-minutes: 6
        working-directory: engine
        run: timeout --kill-after=60s 300s "${{ steps.candidate-build.outputs.executable }}"

  rust-all:
    needs: check
    if: github.event_name != 'merge_group' && needs.check.outputs.rust-needed == 'true'
    uses: ./.github/workflows/rust-tests.yml
