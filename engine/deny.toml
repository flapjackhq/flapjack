[advisories]
version = 2
# Temporary ignores for quick-xml advisories that have NO reachable fix:
# quick-xml is a transitive dep of rust-s3 (our S3 snapshot backend, feature
# "s3-snapshots"). The advisories' patched version is quick-xml >=0.41.0, but
# rust-s3 0.37.2 — the LATEST release as of 2026-07-06 — pins quick-xml ^0.38,
# so no cargo update / upgrade path exists until rust-s3 ships a release on
# quick-xml >=0.41. Exposure is limited: quick-xml only parses XML responses
# from the operator-configured S3 endpoint (trusted infrastructure), not
# user/attacker-controlled input, and both advisories are DoS-only (no
# integrity/confidentiality impact).
# REMOVE these ignores (and the matching ones in .cargo/audit.toml — keep the
# two files in lockstep) as soon as a rust-s3 release depends on quick-xml
# >=0.41: check https://crates.io/crates/rust-s3 then `cargo update rust-s3`.
# Tracked in ROADMAP.md (RUSTSEC quick-xml row).
# RUSTSEC-2026-0253 is separately bounded to Tantivy's sole
# LruCache<usize, Block>: the advisory requires a key with a panicking Drop,
# which usize cannot provide. Remove it when Tantivy permits lru >=0.18.2.
# 2026-11-17 maintenance dispositions (paired with .cargo/audit.toml):
# chrono is reachable in core/HTTP/SSL, including key/certificate expiry and
# analytics; chrono-tz reaches Arrow/DataFusion date/time operations; humantime
# reaches object_store duration configuration parsing. These three notices are
# informational unmaintained reports with no patched versions. The assessed
# Arrow 60.1.0, DataFusion 55.3.0 and object_store 0.14.2 releases still require
# this graph, so changing direct chrono calls alone cannot remove it.
# Migration/review: private Bead flapjack-56f, review by 2026-12-17. REMOVE the
# exact IDs in both configs when a maintained compatible graph is validated or
# the notices are withdrawn; preserve expiry, parsing and analytics behavior.
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "quadratic-runtime DoS in quick-xml; fix (>=0.41) unreachable behind rust-s3 0.37.2 (latest); S3-response parsing only" },
    { id = "RUSTSEC-2026-0195", reason = "NsReader memory-exhaustion DoS in quick-xml; fix (>=0.41) unreachable behind rust-s3 0.37.2 (latest); S3-response parsing only" },
    { id = "RUSTSEC-2026-0253", reason = "2026-08-12: lru panic-safety fix (>=0.18.2) is unreachable behind latest tantivy 0.26.1 (^0.16.3); Tantivy's sole cache key is usize, whose Drop cannot panic" },
    { id = "RUSTSEC-2026-0542", reason = "2026-11-17: humantime maintenance notice; object_store duration parser remains reachable; no patched version; remove after maintained graph migration tracked in flapjack-56f" },
    { id = "RUSTSEC-2026-0543", reason = "2026-11-17: chrono maintenance notice; runtime expiry/date operations remain reachable; no patched version; remove after maintained graph migration tracked in flapjack-56f" },
    { id = "RUSTSEC-2026-0555", reason = "2026-11-17: chrono-tz maintenance notice; Arrow/DataFusion date/time operations remain reachable; no patched version; remove after maintained graph migration tracked in flapjack-56f" },
]

[licenses]
# Gate dependency licenses so a GPL/AGPL crate cannot enter the tree unnoticed.
# The engine ships under Elastic-2.0; a copyleft dependency that reaches beyond
# file scope would conflict with that and with the ability to offer commercial
# terms. Every entry below was observed in the resolved tree via
# `cargo deny list`; add a license here only after confirming it is permissive
# or file-scoped, never to silence a failure.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Elastic-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    # File-scoped copyleft. Compatible with shipping under Elastic-2.0 as long
    # as we link these crates unmodified: attohttpc, colored, htmlescape.
    # Modifying an MPL file obliges us to publish that file. Do not vendor and
    # patch them without recording it here.
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "zlib-acknowledgement",
]
