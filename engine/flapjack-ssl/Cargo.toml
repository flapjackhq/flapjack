[package]
name = "flapjack-ssl"
version = "1.0.16"
edition = "2021"
license = "Elastic-2.0"

[dependencies]
tokio = { version = "1.35", features = ["sync", "fs"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
once_cell = "1.19"
dashmap = "6.0"
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls"] }
# Direct dependency so this crate can install the rustls provider instant-acme
# needs; see acme::install_default_crypto_provider.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rcgen = "0.13"
x509-parser = "0.16"
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1.35", features = ["macros", "rt-multi-thread", "sync", "time"] }
serial_test = "3.0"
